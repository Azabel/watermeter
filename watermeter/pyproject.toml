[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermeter"
version = "0.6.0"
description = "Lector OpenCV de contador de agua con salida MQTT"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "paho-mqtt>=1.6",
]

[project.scripts]
watermeter = "watermeter.cli:main"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watermeter = ["web/*.html"]
